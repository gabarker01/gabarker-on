<!DOCTYPE html>
<html lang="en" class="profile-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="TapMap leaderboards: today, this week and all time.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Leaderboards · TapMap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230b0d12'/%3E%3Ccircle cx='18' cy='22' r='12' fill='%231c2a3d'/%3E%3Cpath d='M10 27C13 15 23 10 28.5 11.5' fill='none' stroke='%23d9b26a' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='1.4 2.6'/%3E%3Cpath d='M29 14.5c-.6-2.1-3.4-3.3-3.4-6a3.4 3.4 0 0 1 6.8 0c0 2.7-2.8 3.9-3.4 6z' fill='%23d9b26a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/tapmap/tapmap.css?v=28">
</head>
<body class="profile-page">
  <header class="profile-bar">
    <a class="wordmark" href="/tapmap/" aria-label="Back to TapMap">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <radialGradient id="mark-sphere" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="var(--mark-light)"/>
            <stop offset="1" stop-color="var(--mark-deep)"/>
          </radialGradient>
          <clipPath id="mark-clip"><circle cx="18" cy="21" r="14"/></clipPath>
        </defs>
        <circle cx="18" cy="21" r="16.5" fill="none" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="0.8"/>
        <circle cx="18" cy="21" r="14" fill="url(#mark-sphere)"/>
        <g clip-path="url(#mark-clip)" fill="none" stroke="var(--mark-line)" stroke-width="0.7">
          <ellipse cx="18" cy="21" rx="6" ry="14"/>
          <path d="M4 21h28M5.8 14.5c7.4 2.2 17 2.2 24.4 0M5.8 27.5c7.4-2.2 17-2.2 24.4 0"/>
        </g>
        <path class="mark-arc" d="M9 27C13 13 24 9 29.5 10.5" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.2 2.6"/>
        <path d="M30 13.2c-.5-1.9-3.1-3-3.1-5.5a3.1 3.1 0 0 1 6.2 0c0 2.5-2.6 3.6-3.1 5.5z" fill="var(--accent)"/>
        <circle cx="30" cy="7.7" r="1.1" fill="var(--paper)"/>
      </svg>
      <span class="wordmark-text">
        <span class="wordmark-name">Tap<em>Map</em></span>
        <span class="wordmark-edition">Leaderboards</span>
      </span>
    </a>
    <div class="bar-actions">
      <a class="chip-button" href="/tapmap/">Today's game</a>
      <span id="account-slot"></span>
    </div>
  </header>

    <main class="profile-main leaderboard-main">
    <p class="eyebrow">Leaderboards</p>
    <h1 class="sheet-title">Everyone, <em>everywhere.</em></h1>
    <p class="lead">Every player with an account, ranked by points from the daily game.</p>

    <div class="board-tabs" role="tablist" aria-label="Leaderboard">
      <button class="board-tab" role="tab" type="button" data-period="day" aria-selected="true">Today</button>
      <button class="board-tab" role="tab" type="button" data-period="week" aria-selected="false">This week</button>
      <button class="board-tab" role="tab" type="button" data-period="all" aria-selected="false">All time</button>
    </div>
    <p id="board-dates" class="board-dates"></p>

    <ol id="board-list" class="friends-list league-list board-list" aria-live="polite"></ol>
    <p id="board-empty" class="friends-empty" hidden></p>
    <p id="board-signin" class="board-signin" hidden><a id="board-signin-link" href="/tapmap/?signin=1">Sign in</a> to get on the leaderboard. Games played without an account aren't ranked.</p>

    <a class="secondary-button link-as-button" href="/tapmap/">Today's game</a>

    <p class="colophon">George Barker · <a href="/">gabarker.com</a> · <a href="/tapmap/privacy/">Privacy</a> · <a href="/tapmap/termsofservice/">Terms</a></p>
  </main>

  <script type="module" src="/tapmap/leaderboard/leaderboard.js?v=1"></script>
</body>
</html>
