<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Something new is on the way.">
  <title>Coming Soon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <p class="eyebrow">Under construction</p>
    <h1>Something new is <span class="accent">coming soon</span>.</h1>
    <p class="lead">
      We're working on it. Check back shortly, or leave your email and we'll let you know when it's live.
    </p>

    <form id="notify-form" class="notify" novalidate>
      <label for="email" class="visually-hidden">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <button type="submit">Notify me</button>
    </form>
    <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
