<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: look around a Street View, then guess where in the world you are.">
  <meta name="theme-color" content="#0B1426">
  <title>Leaderboard · GeoBarkr</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1426'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.8'/%3E%3Cellipse cx='16' cy='16' rx='4.4' ry='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Cpath d='M5.5 16h21' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Ccircle cx='20.5' cy='11.5' r='3.4' fill='%23FF8A5B' stroke='%230B1426' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=4">
</head>
<body class="has-band">
  <div id="gb-header"></div>
  <main>
    <div class="gb-band short" id="band"></div>
    <div class="gb-page">
      <h1 class="gb-title">Leaderboard</h1>
      <div class="gb-tabs" role="tablist">
        <button type="button" role="tab" id="tab-total" aria-selected="true">Total points</button>
        <button type="button" role="tab" id="tab-best" aria-selected="false">Best game</button>
      </div>
      <p class="gb-loading" id="loading">Loading the leaderboard…</p>
      <div class="gb-podium" id="podium" hidden></div>
      <div class="gb-lines" id="rows"></div>
      <p class="gb-lede" id="empty" hidden>No finished games yet. <a href="/geobarkr/">Start a game</a> to get on the board.</p>
      <p class="gb-muted" style="font-size:13px;margin-top:14px">All finished games, every mode.</p>
    </div>
  </main>
  <script type="module" src="/geobarkr/js/pages/leaderboard.js?v=4"></script>
</body>
</html>
