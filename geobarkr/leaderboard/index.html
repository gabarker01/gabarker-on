<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: find where you are from Street View, then guess on the map.">
  <meta name="theme-color" content="#cc0000">
  <title>Leaderboard · GeoBarkr</title>
  <link rel="icon" type="image/png" href="/geobarkr/assets/icon.png">
  <link rel="apple-touch-icon" href="/geobarkr/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=1">
</head>
<body>
  <div id="gb-header"></div>
  <main class="gb-page">
    <h1 class="gb-page-title">Leaderboard</h1>
    <p class="gb-muted">All finished games, in every mode.</p>
    <div class="gb-tabs" role="tablist" style="max-width: 420px">
      <button type="button" role="tab" id="tab-total" aria-selected="true">Total points</button>
      <button type="button" role="tab" id="tab-best" aria-selected="false">Best game</button>
    </div>
    <p class="gb-loading" id="loading">Loading the leaderboard…</p>
    <div class="gb-table-wrap"><table class="gb-table" id="board" hidden></table></div>
    <p id="empty" hidden>No finished games yet. <a href="/geobarkr/">Start a game</a> to get on the board.</p>
  </main>
  <script type="module" src="/geobarkr/js/pages/leaderboard.js?v=1"></script>
</body>
</html>
