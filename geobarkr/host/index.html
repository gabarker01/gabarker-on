<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: find where you are from Street View, then guess on the map.">
  <meta name="theme-color" content="#cc0000">
  <title>Host · GeoBarkr</title>
  <link rel="icon" type="image/png" href="/geobarkr/assets/icon.png">
  <link rel="apple-touch-icon" href="/geobarkr/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=1">
</head>
<body>
  <div id="gb-header"></div>
  <main class="gb-host">
    <div class="gb-pano-wrap">
      <div class="gb-pano" id="pano"></div>
      <div class="gb-sign gb-round-sign" id="round-badge" hidden></div>
      <button class="gb-home" type="button" id="home" aria-label="Back to where the round started">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5z" fill="white"/></svg>
      </button>
    </div>
    <section class="gb-host-side" aria-labelledby="guesses-title">
      <h2 id="guesses-title">Guesses this round</h2>
      <p class="gb-progress" id="progress"></p>
      <table class="gb-table"><thead><tr><th>Player</th><th class="gb-num">Time</th></tr></thead><tbody id="guess-rows"></tbody></table>
      <div class="gb-actions">
        <button class="gb-button gb-button-quiet gb-sound" type="button" id="sound">Turn on the guess sound</button>
        <button class="gb-button gb-button-quiet" type="button" id="end-round" hidden>End round now</button>
      </div>
    </section>
  </main>
  <div class="gb-overlay" id="results" hidden>
    <div class="gb-overlay-body" role="dialog" aria-modal="true" aria-labelledby="results-title">
      <h2 id="results-title">Round results</h2>
      <div class="gb-results-map" id="results-map"></div>
      <div class="gb-sign gb-distance-sign" id="results-sign"></div>
      <button class="gb-button gb-button-block" type="button" id="continue" hidden>Continue</button>
      <p class="gb-muted" id="results-wait" hidden></p>
    </div>
  </div>
  <script type="module" src="/geobarkr/js/pages/host.js?v=1"></script>
</body>
</html>
