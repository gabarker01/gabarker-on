<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: look around a Street View, then guess where in the world you are.">
  <meta name="theme-color" content="#0B1426">
  <title>Host · GeoBarkr</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1426'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.8'/%3E%3Cellipse cx='16' cy='16' rx='4.4' ry='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Cpath d='M5.5 16h21' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Ccircle cx='20.5' cy='11.5' r='3.4' fill='%23FF8A5B' stroke='%230B1426' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=3">
</head>
<body>
  <main class="gb-game">
    <div class="gb-topbar">
      <div class="left"><a class="home-link" id="home-link" href="/geobarkr/" aria-label="GeoBarkr home"></a><b id="round-label">Round</b><div class="gb-steps" id="steps"></div></div>
      <div class="right" id="score"></div>
    </div>
    <div class="gb-host-body">
      <div class="gb-sv">
        <div class="gb-pano" id="pano"></div>
        <button class="gb-recentre" type="button" id="home" aria-label="Back to where the round started">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></svg>
        </button>
      </div>
      <section class="gb-side" aria-labelledby="guesses-title">
        <h2 id="guesses-title">Guesses this round</h2>
        <p class="gb-muted" id="progress" style="margin:0 0 6px"></p>
        <div class="gb-lines" id="guess-list"></div>
        <div class="gb-actions" style="margin-top:14px">
          <button class="gb-btn quiet small" type="button" id="sound">Turn on the guess sound</button>
          <button class="gb-btn quiet small" type="button" id="end-round" hidden>End round now</button>
        </div>
      </section>
    </div>
  </main>
  <div class="gb-results" id="results" hidden>
    <div class="gb-results-body" role="dialog" aria-modal="true" aria-labelledby="results-title">
      <div class="gb-results-head"><b id="results-title">Round results</b><span class="place" id="results-place"></span></div>
      <div class="gb-results-map" id="results-map"></div>
      <div class="gb-results-info">
        <div class="gb-summary" id="results-summary"></div>
        <div class="gb-ranked" id="results-ranked"></div>
        <button class="gb-btn block" type="button" id="continue" hidden>Continue</button>
        <p class="wait" id="results-wait" hidden></p>
      </div>
    </div>
  </div>
  <script type="module" src="/geobarkr/js/pages/host.js?v=3"></script>
</body>
</html>
