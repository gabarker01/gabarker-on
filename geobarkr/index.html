<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: look around a Street View, then guess where in the world you are.">
  <meta name="theme-color" content="#F3F5F7">
  <title>GeoBarkr</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1426'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.8'/%3E%3Cellipse cx='16' cy='16' rx='4.4' ry='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Cpath d='M5.5 16h21' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Ccircle cx='20.5' cy='11.5' r='3.4' fill='%23FF8A5B' stroke='%230B1426' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=11">
</head>
<body class="has-band is-home">
  <div id="gb-header"></div>
  <main class="gb-home">
    <div class="gb-home-map" id="band"></div>
    <a class="gb-home-chip" id="home-chip" href="/geobarkr/games/" hidden></a>
    <section class="gb-home-sheet" aria-labelledby="home-title">
      <h1 class="gb-vh" id="home-title">Start a game of GeoBarkr</h1>
      <a class="gb-resume" id="resume" hidden></a>
      <div class="gb-seg" id="modes" role="radiogroup" aria-label="How do you want to play?">
        <button type="button" role="radio" aria-checked="true" data-type="single_player" data-play="Play solo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>Solo</button>
        <button type="button" role="radio" aria-checked="false" data-type="multiplayer" data-play="Play with friends">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="9" r="3"/><circle cx="16.5" cy="9" r="3"/><path d="M3 19c.9-2.8 2.9-4.3 5.5-4.3S13.1 16.2 14 19M13 15.5c1-.6 2.1-.8 3.5-.8 2.6 0 4.6 1.5 5.5 4.3"/></svg>Friends</button>
        <button type="button" role="radio" aria-checked="false" data-type="local_multiplayer" data-play="Start a party">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Party</button>
      </div>
      <p class="gb-mode-note" id="mode-note">Five rounds on your own.</p>
      <button class="gb-maprow" type="button" id="map-button" aria-haspopup="dialog" disabled>
        <span>Map</span><b id="map-name">Loading maps…</b>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="gb-btn block gb-play" type="button" id="play-button">Play solo</button>
      <form class="gb-joinrow" id="join-form">
        <input class="gb-code" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Room code" aria-label="Room code" required>
        <button type="submit" id="join-button">Join</button>
      </form>
      <p class="gb-colophon"><a href="mailto:info@bearings.quest">info@bearings.quest</a> · <a href="/geobarkr/about/">About</a> · <a href="/geobarkr/privacy/">Privacy</a> · <a href="/geobarkr/termsofservice/">Terms</a></p>
    </section>
  </main>
  <dialog class="gb-help gb-picker" id="map-picker" aria-labelledby="map-picker-title">
    <div class="gb-help-head"><h2 id="map-picker-title">Choose a map</h2><span id="map-picker-close"></span></div>
    <input class="gb-search" id="map-search" type="search" placeholder="Search maps" aria-label="Search maps" autocomplete="off" enterkeyhint="search">
    <div class="gb-picklist" id="map-list" role="listbox" aria-labelledby="map-picker-title"></div>
    <p class="gb-muted" id="map-empty" hidden>No maps match that.</p>
  </dialog>
  <script type="module" src="/geobarkr/js/pages/start.js?v=11"></script>
</body>
</html>
