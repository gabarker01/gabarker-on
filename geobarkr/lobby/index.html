<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: find where you are from Street View, then guess on the map.">
  <meta name="theme-color" content="#cc0000">
  <title>Lobby · GeoBarkr</title>
  <link rel="icon" type="image/png" href="/geobarkr/assets/icon.png">
  <link rel="apple-touch-icon" href="/geobarkr/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=1">
</head>
<body>
  <div id="gb-header"></div>
  <main class="gb-page">
    <h1 class="gb-page-title">Game lobby</h1>
    <div class="gb-columns" id="lobby" hidden>
      <section class="gb-section">
        <h2 id="players-title">Players</h2>
        <p class="gb-muted" id="host-note" hidden></p>
        <ul class="gb-players" id="players"></ul>
        <dl class="gb-facts" style="margin-top: 20px">
          <dt>Game type</dt><dd id="info-type"></dd>
          <dt>Map</dt><dd id="info-map"></dd>
          <dt>Rounds</dt><dd id="info-rounds"></dd>
          <dt>Players</dt><dd id="info-players"></dd>
        </dl>
      </section>
      <section class="gb-section gb-share">
        <div class="gb-sign gb-code-sign" style="width: 100%">
          <span class="gb-code-label">Room code</span>
          <span class="gb-code" id="room-code"></span>
        </div>
        <div id="qr"></div>
        <p class="gb-muted" id="join-help"></p>
        <button class="gb-button gb-button-block" type="button" id="start-button" hidden>Start game</button>
        <p class="gb-muted" id="waiting-note"></p>
      </section>
    </div>
    <p class="gb-loading" id="loading">Loading the lobby…</p>
  </main>
  <script type="module" src="/geobarkr/js/pages/lobby.js?v=1"></script>
</body>
</html>
