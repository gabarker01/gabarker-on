<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: look around a Street View, then guess where in the world you are.">
  <meta name="theme-color" content="#F3F5F7">
  <title>Lobby · GeoBarkr</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1426'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.8'/%3E%3Cellipse cx='16' cy='16' rx='4.4' ry='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Cpath d='M5.5 16h21' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Ccircle cx='20.5' cy='11.5' r='3.4' fill='%23FF8A5B' stroke='%230B1426' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=14">
</head>
<body class="has-band">
  <div id="gb-header"></div>
  <main>
    <div class="gb-band short" id="band"></div>
    <div class="gb-page wide">
      <p class="gb-muted" id="game-meta" style="margin:8px 2px 0"></p>
      <h1 class="gb-title" style="margin-top:2px">Invite your friends</h1>
      <p class="gb-loading" id="loading">Loading the lobby…</p>
      <div class="gb-lobby" id="lobby" hidden>
        <section class="gb-section">
          <div class="gb-codecard">
            <div id="qr"></div>
            <div class="gb-codecard-code">
              <div class="gb-muted" style="font-size:13px">Room code</div>
              <div class="gb-roomcode" id="room-code"></div>
            </div>
            <button class="gb-btn block gb-share" type="button" id="share-button" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
            Share invite link
            </button>
          </div>
          <p class="gb-muted" id="join-help" style="font-size:14px;margin:10px 2px 0"></p>
        </section>
        <section class="gb-section">
          <div class="gb-label" id="players-title" style="margin-top:0">Players</div>
          <p class="gb-muted" id="host-note" hidden style="margin:0 2px 8px;font-size:14px"></p>
          <div class="gb-lines" id="players"></div>
          <div style="margin-top:18px">
            <button class="gb-btn block" type="button" id="start-button" hidden>Start game</button>
            <button class="gb-btn quiet block gb-cancel" type="button" id="cancel-button" hidden>Cancel game</button>
            <p class="gb-muted" id="waiting-note" style="text-align:center;margin:10px 0 0"></p>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="/geobarkr/js/pages/lobby.js?v=14"></script>
</body>
</html>
