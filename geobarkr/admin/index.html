<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: find where you are from Street View, then guess on the map.">
  <meta name="theme-color" content="#cc0000">
  <title>Admin · GeoBarkr</title>
  <link rel="icon" type="image/png" href="/geobarkr/assets/icon.png">
  <link rel="apple-touch-icon" href="/geobarkr/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=1">
</head>
<body>
  <div id="gb-header"></div>
  <main class="gb-page">
    <h1 class="gb-page-title">Admin</h1>
    <p class="gb-loading" id="denied" hidden>This page is for GeoBarkr admins. <a href="/geobarkr/">Back to the game</a></p>
    <div id="admin" hidden>
      <div class="gb-columns">
        <section class="gb-section">
          <h2>Maps</h2>
          <p class="gb-muted">Only active maps can be picked when starting a game.</p>
          <div class="gb-table-wrap"><table class="gb-table" id="maps"></table></div>
          <form class="gb-admin-row" id="new-map" style="margin-top: 12px">
            <input class="gb-input" name="name" maxlength="80" placeholder="New map name" aria-label="New map name" required>
            <button class="gb-button" type="submit">Add map</button>
          </form>
        </section>
        <section class="gb-section" id="locations-section" hidden>
          <h2 id="locations-title">Locations</h2>
          <p class="gb-muted">One location per round, rounds 1 to 5.</p>
          <div class="gb-table-wrap"><table class="gb-table" id="locations"></table></div>
        </section>
      </div>

      <section class="gb-section" id="editor-section" hidden>
        <h2 id="editor-title">Add a location</h2>
        <div class="gb-columns">
          <form id="editor">
            <label class="gb-field"><span>Street View link (optional)</span><input class="gb-input" id="paste" placeholder="Paste a google.com/maps Street View link to fill in the place and view" autocomplete="off"></label>
            <div class="gb-form-grid">
              <label class="gb-field gb-span-2"><span>Name</span><input class="gb-input" name="name" maxlength="80" required></label>
              <label class="gb-field"><span>Round</span><select class="gb-select" name="round_number" required><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
              <span></span>
              <label class="gb-field"><span>Latitude</span><input class="gb-input" name="lat" type="number" step="any" min="-90" max="90" inputmode="decimal" required></label>
              <label class="gb-field"><span>Longitude</span><input class="gb-input" name="lng" type="number" step="any" min="-180" max="180" inputmode="decimal" required></label>
              <label class="gb-field"><span>Heading (0–359)</span><input class="gb-input" name="heading" type="number" step="any" min="0" max="359.99" inputmode="decimal" value="0" required></label>
              <label class="gb-field"><span>Pitch (−90 to 90)</span><input class="gb-input" name="pitch" type="number" step="any" min="-90" max="90" inputmode="decimal" value="0" required></label>
            </div>
            <div class="gb-admin-row">
              <button class="gb-button" type="submit" id="save-location">Save location</button>
              <button class="gb-button gb-button-quiet" type="button" id="preview">Preview</button>
              <button class="gb-button gb-button-quiet" type="button" id="cancel-edit">Cancel</button>
            </div>
          </form>
          <div>
            <div class="gb-admin-pano"><div class="gb-pano" id="admin-pano"></div></div>
            <button class="gb-button gb-button-quiet gb-button-block" type="button" id="use-view">Use this view</button>
            <p class="gb-muted">Move and turn the preview until it's the view players should start with, then press Use this view.</p>
          </div>
        </div>
      </section>

      <section class="gb-section">
        <h2>Recent games</h2>
        <div class="gb-table-wrap"><table class="gb-table" id="games"></table></div>
      </section>
    </div>
  </main>
  <script type="module" src="/geobarkr/js/pages/admin.js?v=1"></script>
</body>
</html>
