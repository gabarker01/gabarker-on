<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: look around a Street View, then guess where in the world you are.">
  <meta name="theme-color" content="#0B1426">
  <title>Sign in · GeoBarkr</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1426'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.8'/%3E%3Cellipse cx='16' cy='16' rx='4.4' ry='10.5' fill='none' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Cpath d='M5.5 16h21' stroke='%23E6EEFA' stroke-width='1.3' opacity='.6'/%3E%3Ccircle cx='20.5' cy='11.5' r='3.4' fill='%23FF8A5B' stroke='%230B1426' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=5">
</head>
<body>
  <main class="gb-signin">
    <div class="gb-signin-map" id="signin-map"></div>
    <div class="gb-signin-body">
      <div class="gb-signin-brand" id="brand">GeoBarkr</div>
      <p class="gb-lede" id="signin-intro">Look around. Guess where you are. Five rounds, on your own or with friends.</p>

      <form id="demo-form" hidden>
        <p class="gb-muted" style="margin:0 0 12px">Demo mode: no account needed. Your games are saved on this device, and bots play the other players.</p>
        <label class="gb-field"><span>Your name</span><input class="gb-input" name="name" maxlength="40" autocomplete="nickname" required></label>
        <button class="gb-btn block" type="submit">Start playing</button>
      </form>

      <div id="email-area" hidden>
        <form id="email-form">
          <label class="gb-field" id="name-field" hidden><span>Your name</span><input class="gb-input" name="name" maxlength="40" autocomplete="nickname" placeholder="Shown to other players"></label>
          <label class="gb-field"><span class="gb-vh">Email</span><input class="gb-input" type="email" name="email" autocomplete="email" placeholder="Email" required></label>
          <label class="gb-field"><span class="gb-vh">Password</span><input class="gb-input" type="password" name="password" minlength="6" autocomplete="current-password" placeholder="Password" required></label>
          <button class="gb-btn block" type="submit" id="email-button">Sign in</button>
        </form>
      </div>
      <div id="google-area" hidden>
        <div class="gb-or" id="google-divider">or</div>
        <button class="gb-btn block google" type="button" id="google-button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continue with Google
        </button>
      </div>
      <p class="gb-muted" id="switch-line" style="text-align:center;margin:18px 0 0" hidden><span id="switch-text">New here?</span> <a href="#" id="switch-link">Create an account</a></p>
      <p class="gb-colophon"><a href="/geobarkr/about/">About</a> · <a href="/geobarkr/privacy/">Privacy</a> · <a href="/geobarkr/termsofservice/">Terms</a> · <a href="/">gabarker.com</a></p>
    </div>
  </main>
  <script type="module" src="/geobarkr/js/pages/signin.js?v=4"></script>
</body>
</html>
