<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: find where you are from Street View, then guess on the map.">
  <meta name="theme-color" content="#cc0000">
  <title>Sign in · GeoBarkr</title>
  <link rel="icon" type="image/png" href="/geobarkr/assets/icon.png">
  <link rel="apple-touch-icon" href="/geobarkr/assets/icon.png">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=1">
</head>
<body>
  <main class="gb-page" style="max-width: 460px">
    <div class="gb-card">
      <img class="gb-card-logo" src="/geobarkr/assets/logo.png" alt="GeoBarkr">
      <p class="gb-center gb-muted" id="signin-intro">Sign in to play.</p>
      <div id="email-area" hidden>
        <div class="gb-tabs" role="tablist">
          <button type="button" role="tab" id="tab-signin" aria-selected="true">Sign in</button>
          <button type="button" role="tab" id="tab-signup" aria-selected="false">Create account</button>
        </div>
        <form id="email-form">
          <label class="gb-field" id="name-field" hidden><span>Your name</span><input class="gb-input" name="name" maxlength="40" autocomplete="nickname" placeholder="Shown to other players"></label>
          <label class="gb-field"><span>Email</span><input class="gb-input" type="email" name="email" autocomplete="email" required></label>
          <label class="gb-field"><span>Password</span><input class="gb-input" type="password" name="password" minlength="6" autocomplete="current-password" required></label>
          <button class="gb-button gb-button-block" type="submit" id="email-button">Sign in</button>
        </form>
      </div>
      <div id="google-area" hidden>
        <div class="gb-divider" id="google-divider">or</div>
        <button class="gb-button gb-button-block gb-button-google" type="button" id="google-button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continue with Google
        </button>
      </div>
    </div>
    <p class="gb-center gb-muted"><a href="/">gabarker.com</a></p>
  </main>
  <script type="module" src="/geobarkr/js/pages/signin.js?v=1"></script>
</body>
</html>
