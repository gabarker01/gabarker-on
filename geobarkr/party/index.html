<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="GeoBarkr: find where you are from Street View, then guess on the map.">
  <meta name="theme-color" content="#cc0000">
  <title>Play · GeoBarkr</title>
  <link rel="icon" type="image/png" href="/geobarkr/assets/icon.png">
  <link rel="apple-touch-icon" href="/geobarkr/assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/geobarkr/css/geobarkr.css?v=1">
</head>
<body>
  <div id="gb-header"></div>
  <main class="gb-party">
    <h1 class="gb-party-head" id="round-head">Loading…</h1>
    <div class="gb-map-box" id="map-box">
      <div class="gb-map" id="map"></div>
    </div>
    <button class="gb-button gb-button-block" type="button" id="guess" disabled>Tap the map to place your guess</button>
    <section class="gb-party-status" id="status" hidden aria-live="polite">
      <h2 id="status-title"></h2>
      <div class="gb-sign gb-distance-sign" id="status-sign" hidden></div>
      <p id="status-text"></p>
    </section>
  </main>
  <script type="module" src="/geobarkr/js/pages/party.js?v=1"></script>
</body>
</html>
